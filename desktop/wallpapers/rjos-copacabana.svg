<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <linearGradient id="waveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="50%" stop-color="#161a20" />
      <stop offset="100%" stop-color="#0e1722" />
    </linearGradient>

    <!-- Padrão das Ondas do Calçadão de Copacabana -->
    <pattern id="copaPattern" x="0" y="0" width="240" height="120" patternUnits="userSpaceOnUse">
      <path d="M 0 60 Q 60 0, 120 60 T 240 60" fill="none" stroke="#005B96" stroke-width="2.5" opacity="0.18" />
      <path d="M 0 120 Q 60 60, 120 120 T 240 120" fill="none" stroke="#292929" stroke-width="2" opacity="0.3" />
    </pattern>

    <radialGradient id="oceanCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#005B96" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#00A86B" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#121212" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo Carvão -->
  <rect width="3840" height="2160" fill="url(#waveBg)" />

  <!-- Padrão geométrico suave das ondas -->
  <rect width="3840" height="2160" fill="url(#copaPattern)" />

  <!-- Luz suave centralizada -->
  <rect width="3840" height="2160" fill="url(#oceanCenter)" />

  <!-- Faixas geométricas fluidas com a paleta oficial -->
  <path d="M 0 1480 Q 960 1280, 1920 1480 T 3840 1480 L 3840 2160 L 0 2160 Z" fill="#005B96" opacity="0.08" />
  <path d="M 0 1620 Q 960 1780, 1920 1620 T 3840 1620 L 3840 2160 L 0 2160 Z" fill="#1E1E1E" opacity="0.75" />
  <path d="M 0 1840 Q 960 1720, 1920 1840 T 3840 1840 L 3840 2160 L 0 2160 Z" fill="#121212" opacity="0.95" />

  <!-- Logo Geométrico RJOS no Centro Superior -->
  <circle cx="1920" cy="880" r="88" fill="#1E1E1E" stroke="#005B96" stroke-width="3" />
  <path d="M 1880 880 Q 1920 840, 1960 880 T 2000 880" fill="none" stroke="#F2C94C" stroke-width="4" stroke-linecap="round" />
  <circle cx="1920" cy="840" r="10" fill="#00A86B" />

  <text x="1920" y="1030" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">RJOS</text>
  <text x="1920" y="1070" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#B8B8B8" text-anchor="middle" letter-spacing="4">RIO DE JANEIRO OPERATING SYSTEM</text>
</svg>
