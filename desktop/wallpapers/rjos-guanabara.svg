      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="85%" stop-color="#0e2336" />
      <stop offset="100%" stop-color="#005B96" />
    </linearGradient>

    <linearGradient id="gbBay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005B96" />
      <stop offset="30%" stop-color="#003e66" />
      <stop offset="70%" stop-color="#00253d" />
      <stop offset="100%" stop-color="#121212" />
