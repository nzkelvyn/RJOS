  <!-- Espelho d'Água da Baía de Guanabara -->
  <rect x="0" y="1660" width="3840" height="500" fill="url(#gbBay)" />

  <!-- Reflexo do Sol -->
  <ellipse cx="2100" cy="1710" rx="180" ry="8" fill="#F2C94C" opacity="0.3" />
  <ellipse cx="2100" cy="1750" rx="280" ry="8" fill="#005B96" opacity="0.4" />

